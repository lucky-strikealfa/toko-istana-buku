/* ================= KASIR ================= */
let cart = {}; // id -> {qty, harga, sat}   sat = "pcs" | "pack"
let ubay = ""; // uang bayar (angka mentah)
let kcat = ""; // catatan transaksi
let totalCart = 0;
let tipeBeli = "umum"; // umum | kjp
let KONF = { kjp: 0.15 }; // diganti dari server saat aplikasi dibuka

function persenTipe() {
  return tipeBeli === "kjp" ? KONF.kjp : 0;
}
const NAMA_TIPE = { umum: "Umum", kjp: "KJP" };

function renderTipe() {
  document.querySelectorAll("#tipeSeg button").forEach(b => {
    const k = b.dataset.k;
    b.classList.toggle("active", k === tipeBeli);
    const p = k === "kjp" ? KONF.kjp : 0;
    b.innerText = NAMA_TIPE[k] + (p ? " −" + fmtPct(p) : "");
  });
}
function setTipe(k) {
  tipeBeli = k;
  renderTipe();
  renderCart();
}

function cocok(b, q) {
  q = q.toLowerCase();
  return !q || (b.nama + " " + b.sku + " " + b.kategori).toLowerCase().indexOf(q) !== -1;
}

function renderKasir() {
  renderTipe();
  const q = $("kCari").value.trim();
  const box = $("kList");
  if (!q) { box.style.display = "none"; box.innerHTML = ""; renderCart(); return; }
  const semua = barang.filter(b => cocok(b, q));
  const list = semua.slice(0, 15);
  box.style.display = "block";
  box.innerHTML = list.length ? list.map(b =>
    '<div class="item' + (b.stok <= 0 ? " off" : "") + '" onclick="pilihBarang(\'' + esc(b.id) + '\')">' +
    '<div class="tx"><div class="nm">' + esc(b.nama) + '</div><div class="sb">' + (b.sku ? esc(b.sku) + " • " : "") + 'Stok ' + b.stok + ' ' + esc(b.satuan) +
    (adaPack(b) ? ' • Pack (isi ' + b.isi + ') ' + rp(b.jualPack) : "") + '</div></div>' +
    '<div class="rt">' + rp(b.jual) + '</div></div>').join("") +
    (semua.length > 15 ? '<div class="empty">Ada ' + semua.length + ' hasil, ketik lebih spesifik…</div>' : "")
    : '<div class="empty">' + (barang.length ? "Barang tidak ditemukan." : "Belum ada barang. Tambahkan di tab Stok.") + '</div>';
  renderCart();
}
$("kCari").addEventListener("input", renderKasir);
// Enter (scanner fisik / ketik kode): kode barang persis, atau hasil pencarian tinggal satu -> langsung masuk keranjang
$("kCari").addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const q = $("kCari").value.trim().toLowerCase();
  if (!q) return;
  let b = barang.find(x => String(x.sku).trim().toLowerCase() === q);
  if (!b) { const l = barang.filter(x => cocok(x, q)); if (l.length === 1) b = l[0]; }
  if (b && b.stok > 0) pilihBarang(b.id);
  else if (b) toast("⚠️ Stok " + b.nama + " habis");
});

// Pilih barang dari hasil cari: masuk keranjang, kolom cari dikosongkan
function pilihBarang(id) {
  if (tambahKeranjang(id)) { $("kCari").value = ""; renderKasir(); }
}

// pengali stok: 1 untuk pcs, isi pack untuk pack
function pengali(b, c) { return c && c.sat === "pack" && adaPack(b) ? b.isi : 1; }

function tambahKeranjang(id) {
  const b = barang.find(x => x.id === id);
  if (!b) return false;
  const cur = cart[id];
  const qty = cur ? cur.qty + 1 : 1;
  if (qty * pengali(b, cur) > b.stok) { toast("⚠️ Stok " + b.nama + " hanya " + b.stok + " pcs"); return false; }
  cart[id] = { qty: qty, harga: cur ? cur.harga : b.jual, sat: cur ? cur.sat : "pcs" };
  renderCart();
  return true;
}
function ubahQty(id, d) {
  const b = barang.find(x => x.id === id);
  const c = cart[id];
  if (!b || !c) return;
  const q = c.qty + d;
  if (q <= 0) { delete cart[id]; }
  else if (q * pengali(b, c) > b.stok) { return toast("⚠️ Stok " + b.nama + " hanya " + b.stok + " pcs"); }
  else c.qty = q;
  renderCart();
}
// Ganti satuan jual di keranjang: Pcs <-> Pack (harga ikut berganti)
function setSat(id, sat) {
  const b = barang.find(x => x.id === id);
  const c = cart[id];
  if (!b || !c) return;
  if (sat === "pack" && !adaPack(b)) { toast("⚠️ Harga pack " + b.nama + " belum diisi di menu Stok"); return renderCart(); }
  const mult = sat === "pack" ? b.isi : 1;
  const maks = Math.floor(b.stok / mult);
  if (maks < 1) { toast("⚠️ Stok " + b.nama + " tidak cukup untuk 1 pack"); return renderCart(); }
  c.sat = sat;
  c.harga = sat === "pack" ? b.jualPack : b.jual;
  if (c.qty > maks) { c.qty = maks; toast("⚠️ Jumlah disesuaikan dengan stok (" + maks + " pack)"); }
  renderCart();
}
function setHarga(id, v) {
  const c = cart[id];
  if (!c) return;
  c.harga = Math.max(0, Number(rawAngka(v)) || 0);
  renderCart();
}

function kosongkanKeranjang() {
  cart = {}; ubay = ""; kcat = "";
  renderCart();
}

// Uang bayar diketik: hanya update kembalian (tanpa render ulang supaya kursor tidak hilang)
function setBayar(v) {
  ubay = rawAngka(v);
  hitungKembali();
}
function uangPas() {
  ubay = String(Math.round(totalCart * 100) / 100);
  const el = $("kBayar");
  if (el) el.value = fmtAngka(ubay);
  hitungKembali();
}

function hitungKembali() {
  const box = $("kKembali");
  if (!box) return;
  const bayar = Number(ubay) || 0;
  const selisih = bayar - totalCart;
  if (ubay === "") {
    box.className = "kembali";
    box.innerHTML = '<span>Uang Kembalian</span><span class="v">Rp 0</span>';
  } else if (selisih < 0) {
    box.className = "kembali kurang";
    box.innerHTML = '<span>Uang Kurang</span><span class="v neg">' + rp(-selisih) + '</span>';
  } else {
    box.className = "kembali";
    box.innerHTML = '<span>Uang Kembalian</span><span class="v pos">' + rp(selisih) + '</span>';
  }
}

function renderCart() {
  const ids = Object.keys(cart).filter(id => barang.some(b => b.id === id));
  if (!ids.length) {
    totalCart = 0;
    $("kCart").innerHTML = '<div class="empty">Keranjang kosong. Cari atau scan barang untuk menambah.</div>';
    return;
  }
  const pct = persenTipe();
  let sub = 0, diskon = 0, hpp = 0, h = "";
  ids.forEach(id => {
    const b = barang.find(x => x.id === id), c = cart[id];
    if (c.sat === "pack" && !adaPack(b)) c.sat = "pcs"; // jaga-jaga kalau data pack dihapus
    const kotor = c.qty * c.harga;
    sub += kotor;
    diskon += Math.round(kotor * pct / 100); // sama dengan perhitungan di server
    hpp += c.qty * pengali(b, c) * b.modal;
    h += '<div class="cartrow"><div class="h"><span>' + esc(b.nama) + (c.sat === "pack" ? ' <span class="badge kjp">Pack ×' + b.isi + '</span>' : '') + '</span><span>' + rp(kotor) + '</span></div>' +
      '<div class="ctl"><button class="qbtn" onclick="ubahQty(\'' + esc(id) + '\',-1)">−</button><span class="qv">' + c.qty + '</span>' +
      '<button class="qbtn" onclick="ubahQty(\'' + esc(id) + '\',1)">＋</button>' +
      (adaPack(b)
        ? '<select onchange="setSat(\'' + esc(id) + '\',this.value)" aria-label="Satuan jual">' +
          '<option value="pcs"' + (c.sat === "pcs" ? " selected" : "") + '>Pcs</option>' +
          '<option value="pack"' + (c.sat === "pack" ? " selected" : "") + '>Pack</option></select>'
        : '') +
      '<input type="text" class="uang" inputmode="numeric" value="' + fmtAngka(c.harga) + '" ' +
      'onchange="setHarga(\'' + esc(id) + '\',this.value)" aria-label="Harga jual"></div></div>';
  });
  const total = sub - diskon;
  totalCart = total;
  const untung = total - hpp;
  const persen = total > 0 ? untung / total * 100 : 0;

  h += '<div class="bayar">';
  if (pct > 0) {
    h += '<div class="ln2" style="color:var(--muted);font-size:13px"><span>Subtotal</span><span>' + rp(sub) + '</span></div>' +
      '<div class="ln2" style="font-size:13px"><span>Diskon ' + NAMA_TIPE[tipeBeli] + ' (' + fmtPct(pct) + ')</span><span class="neg"><b>−' + rp(diskon) + '</b></span></div>';
  }
  h += '<div class="ln2"><span>Total Bayar' + (tipeBeli === "kjp" ? ' <span class="badge kjp">KJP</span>' : '') + '</span><span class="big">' + rp(total) + '</span></div>';
  h += '<div class="ln2" style="color:var(--muted);font-size:13px"><span>Margin</span>' +
    '<span class="' + (untung >= 0 ? "pos" : "neg") + '"><b>' + rp(untung) + ' (' + persen.toFixed(1) + '%)</b></span></div>';
  h += '<label class="l">Uang Bayar</label>' +
    '<div class="inrow"><input type="text" id="kBayar" class="uang" inputmode="numeric" autocomplete="off" placeholder="0" value="' + fmtAngka(ubay) + '" oninput="setBayar(this.value)">' +
    '<button class="btn ghost sm" onclick="uangPas()">Uang Pas</button></div>' +
    '<div class="kembali" id="kKembali"></div>' +
    '</div>';

  h += '<label class="l">Catatan (opsional)</label><input type="text" id="kCatatan" placeholder="Nama pembeli, dll" value="' + esc(kcat) + '" oninput="kcat=this.value">';
  h += '<div class="row"><button class="btn ghost" onclick="kosongkanKeranjang()">Kosongkan</button><button class="btn main" onclick="simpanJual()">✔ Simpan Penjualan</button></div>';
  $("kCart").innerHTML = h;
  hitungKembali();
}

function simpanJual() {
  aksi(async () => {
    const items = Object.keys(cart).map(id => ({ idBarang: id, qty: cart[id].qty, hargaJual: cart[id].harga, satuan: cart[id].sat || "pcs" }));
    if (!items.length) return toast("⚠️ Keranjang kosong");
    const bayar = Number(ubay) || 0;
    if (ubay !== "" && bayar < totalCart) return toast("⚠️ Uang bayar kurang " + rp(totalCart - bayar));
    const r = await run("jual", { items: items, catatan: kcat, tipe: tipeBeli });
    const kembali = ubay !== "" ? bayar - r.total : 0;
    cart = {}; ubay = ""; kcat = ""; tipeBeli = "umum";
    await muatBarang();
    renderKasir();
    toast("✅ Tersimpan • Total " + rp(r.total) + (r.diskon > 0 ? " • Diskon " + rp(r.diskon) : "") +
      (kembali > 0 ? " • Kembalian " + rp(kembali) : "") + (r.untung !== undefined ? " • Untung " + rp(r.untung) : ""), 5000);
  });
}

/* ================= SCAN: KAMERA LANGSUNG (otomatis) + FOTO (cadangan) ================= */
// 1) Kamera langsung: barcode terbaca -> otomatis masuk keranjang, kamera tetap jalan untuk scan berikutnya.
// 2) Kalau kamera langsung diblokir (di web app Apps Script kadang begitu), pakai tombol foto:
//    dari satu foto dibaca berurutan: barcode -> tulisan kode (OCR), dicocokkan ke Kode barang / Nama barang di stok.
let scanner = null, scanLibMuat = null, ocrLibMuat = null, ocrWorker = null;
let lastScan = { k: "", t: 0 };

function muatLibScan() {
  if (window.Html5Qrcode) return Promise.resolve();
  if (scanLibMuat) return scanLibMuat;
  scanLibMuat = new Promise((ok, gagal) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js";
    s.onload = ok;
    s.onerror = () => { scanLibMuat = null; gagal(new Error("Pustaka scan gagal dimuat (cek internet)")); };
    document.head.appendChild(s);
  });
  return scanLibMuat;
}

function muatLibOcr() {
  if (window.Tesseract) return Promise.resolve();
  if (ocrLibMuat) return ocrLibMuat;
  ocrLibMuat = new Promise((ok, gagal) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
    s.onload = ok;
    s.onerror = () => { ocrLibMuat = null; gagal(new Error("Pustaka baca tulisan gagal dimuat (cek internet)")); };
    document.head.appendChild(s);
  });
  return ocrLibMuat;
}

function bukaScan() {
  bukaModal("Scan Barcode",
    '<div style="color:var(--muted);font-size:13px;line-height:1.5">Arahkan kamera ke barcode atau tulisan kode (mis. <b>GP-265NT</b>). Kalau sudah terbaca, barang <b>otomatis masuk keranjang</b> ' +
      'dan kamera tetap jalan untuk scan berikutnya. Klik <b>Selesai</b> kalau sudah.</div>' +
    '<div id="scanBox"></div>' +
    '<div class="scaninfo" id="scanInfo">Menyalakan kamera…</div>' +
    '<div id="scanPilih"></div>' +
    '<div id="scanTmp" style="position:absolute;left:-10000px;top:0;width:1600px;height:10px;overflow:hidden;visibility:hidden"></div>' +
    '<label class="btn ghost fotolbl">📸 Foto barcode / tulisan kode (cadangan)' +
    '<input type="file" accept="image/*" capture="environment" style="display:none" onchange="scanFoto(this)"></label>' +
    '<label class="l">Atau ketik / tempel kode</label>' +
    '<input type="text" id="scanManual" placeholder="Kode barang lalu Enter" autocomplete="off" autocapitalize="characters">' +
    '<div class="row"><button class="btn main" onclick="tutupModal()">Selesai</button></div>');
  $("scanManual").addEventListener("keydown", e => {
    if (e.key !== "Enter") return;
    const v = $("scanManual").value;
    $("scanManual").value = "";
    prosesKode(v);
  });
  lastScan = { k: "", t: 0 };
  mulaiLive_();
}

async function mulaiLive_() {
  try {
    await muatLibScan();
    if (!$("scanBox")) return; // modal sudah ditutup
    const s = new Html5Qrcode("scanBox", { verbose: false, experimentalFeatures: { useBarCodeDetectorIfSupported: true } });
    scanner = s;
    await s.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 260, height: 160 } }, onLive_, () => {});
    scanInfo_("", "Arahkan kamera ke barcode atau tulisan kode…");
    mulaiOcrLoop_();
  } catch (e) {
    scanner = null;
    const box = $("scanBox");
    if (box) box.style.display = "none";
    const m = (e && (e.message || e.name)) ? (e.message || e.name) : String(e);
    if (adaGoogle()) {
      scanInfo_("neg", "⚠️ Kamera langsung diblokir Google selama aplikasi dibuka lewat Apps Script. " +
        "Pakai tombol foto di bawah, atau buka versi hosting (GitHub Pages) supaya scan otomatis jalan.");
    } else {
      scanInfo_("neg", "⚠️ Kamera tidak bisa dibuka (" + m + "). Izinkan akses kamera di browser, atau pakai tombol foto di bawah.");
    }
  }
}

// Dipanggil setiap barcode terbaca oleh kamera langsung
function onLive_(txt) {
  const now = Date.now();
  if (txt === lastScan.k && now - lastScan.t < 2500) return; // jangan dobel saat kode yang sama masih di depan kamera
  lastScan = { k: txt, t: now };
  const b = temukanBarang_(txt);
  if (!b) { scanInfo_("neg", "❌ Kode " + txt + " tidak ada di stok"); return; }
  tambahDariScan_(b, false);
}

/* ---- baca tulisan otomatis dari video langsung ---- */
// Tiap ±1,2 detik satu frame video dibaca (OCR). Kalau kode yang terbaca cocok dengan SATU barang di stok,
// barang itu otomatis masuk keranjang (cooldown 4 detik per barang supaya tidak dobel).
let ocrTimer = null, ocrJalan = false, ocrKe = 0;
const lastId = {};

function mulaiOcrLoop_() {
  clearInterval(ocrTimer);
  ocrTimer = setInterval(ocrTick_, 1200);
}

function cocokOtomatis_(b) {
  const now = Date.now();
  if (lastId[b.id] && now - lastId[b.id] < 4000) return;
  lastId[b.id] = now;
  tambahDariScan_(b, false);
}

async function ocrTick_() {
  if (ocrJalan || !scanner) return;
  const v = document.querySelector("#scanBox video");
  if (!v || !v.videoWidth) return;
  ocrJalan = true;
  try {
    if (!ocrWorker) {
      scanInfo_("", "Menyiapkan pembaca tulisan… (pertama kali agak lama, perlu internet)");
      await muatLibOcr();
      ocrWorker = await Tesseract.createWorker("eng");
      await ocrWorker.setParameters({
        tessedit_char_whitelist: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-./ ",
        tessedit_pageseg_mode: "11"
      });
      if (scanner) scanInfo_("", "Arahkan kamera ke barcode atau tulisan kode…");
    }
    ocrKe++;
    const cv = (ocrKe % 2) ? keCanvasEnh_(v, 1400, false) : keCanvas_(v, 1400);
    const r = await ocrWorker.recognize(cv);
    if (!scanner) return;
    const hasil = cariDariTeks_((r && r.data && r.data.text) || "");
    if (hasil.length === 1) cocokOtomatis_(hasil[0].b);
    else if (hasil.length > 1) tampilPilihan_(hasil.map(h => h.b));
  } catch (e) {
    // abaikan; coba lagi di putaran berikutnya
  } finally {
    ocrJalan = false;
  }
}

/* ---- gambar ---- */
function bacaGambar_(file) {
  return new Promise((ok, gagal) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); ok(img); };
    img.onerror = () => { URL.revokeObjectURL(url); gagal(new Error("Foto tidak bisa dibuka")); };
    img.src = url;
  });
}

// Gambar ke canvas; sisi terpanjang dibatasi `maks` piksel (hanya mengecilkan).
function keCanvas_(img, maks) {
  let w = img.naturalWidth || img.videoWidth || img.width, h = img.naturalHeight || img.videoHeight || img.height;
  const sisi = Math.max(w, h);
  if (maks && sisi > maks) { const s = maks / sisi; w = Math.round(w * s); h = Math.round(h * s); }
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  c.getContext("2d").drawImage(img, 0, 0, w, h);
  return c;
}

// Hitam-putih + kontras diregangkan (membantu baca tulisan kecil). balik = tukar terang/gelap.
function keCanvasEnh_(img, maks, balik) {
  const c = keCanvas_(img, maks);
  try {
    const g = c.getContext("2d");
    const im = g.getImageData(0, 0, c.width, c.height), d = im.data;
    const hist = new Array(256).fill(0), n = d.length / 4;
    for (let i = 0; i < d.length; i += 4) {
      const y = Math.round(0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]);
      d[i] = y; hist[y]++;
    }
    let lo = 0, hi = 255, acc = 0;
    for (let v = 0; v < 256; v++) { acc += hist[v]; if (acc >= n * 0.02) { lo = v; break; } }
    acc = 0;
    for (let v = 255; v >= 0; v--) { acc += hist[v]; if (acc >= n * 0.02) { hi = v; break; } }
    if (hi - lo < 20) { lo = 0; hi = 255; }
    const k = 255 / (hi - lo);
    for (let i = 0; i < d.length; i += 4) {
      let y = Math.max(0, Math.min(255, (d[i] - lo) * k));
      if (balik) y = 255 - y;
      d[i] = d[i + 1] = d[i + 2] = y; d[i + 3] = 255;
    }
    g.putImageData(im, 0, 0);
  } catch (e) {}
  return c;
}

/* ---- barcode dari foto ---- */
async function bacaDenganDetektor_(canvas) {
  if (!("BarcodeDetector" in window)) return "";
  let fmt = ["ean_13", "ean_8", "upc_a", "upc_e", "code_128", "code_39", "itf", "qr_code"];
  try {
    const ada = await window.BarcodeDetector.getSupportedFormats();
    fmt = fmt.filter(f => ada.indexOf(f) >= 0);
  } catch (e) {}
  if (!fmt.length) return "";
  const hasil = await new window.BarcodeDetector({ formats: fmt }).detect(canvas);
  return hasil && hasil[0] ? String(hasil[0].rawValue || "") : "";
}

async function bacaDenganLib_(img) {
  const ukuran = [1600, 1000];
  for (let i = 0; i < ukuran.length; i++) {
    let tmp = null;
    try {
      const blob = await new Promise(ok => keCanvas_(img, ukuran[i]).toBlob(ok, "image/jpeg", 0.92));
      if (!blob) continue;
      tmp = new Html5Qrcode("scanTmp", { verbose: false, experimentalFeatures: { useBarCodeDetectorIfSupported: true } });
      return await tmp.scanFile(new File([blob], "foto.jpg", { type: "image/jpeg" }), false);
    } catch (e) {
      // coba ukuran berikutnya
    } finally {
      try { if (tmp) tmp.clear(); } catch (x) {}
    }
  }
  return "";
}

/* ---- tulisan (OCR) -> cocokkan ke stok ---- */
// Huruf yang sering tertukar dengan angka saat OCR disamakan di kedua sisi (O=0, I/L=1, S=5, Z=2, B=8).
const OCR_PETA = { O: "0", Q: "0", I: "1", L: "1", S: "5", Z: "2", B: "8" };
function alnum_(s) { return String(s || "").toUpperCase().replace(/[^A-Z0-9]/g, ""); }
function normOcr_(s) { return alnum_(s).replace(/[OQILSZB]/g, c => OCR_PETA[c]); }

// "Kode model" satu barang: kata di Kode barang & Nama barang yang berisi angka (mis. GP-265NT, ISBN).
// Kata biasa tanpa angka (JOYKO, GEL) sengaja tidak dipakai supaya tidak mencocokkan semua barang sejenis.
function tokenBarang_(b) {
  const out = [];
  const tambah = s => {
    const a = alnum_(s);
    if (a.length >= 5 && /[0-9]/.test(a) && (/[A-Z]/.test(a) || a.length >= 6)) {
      const n = normOcr_(s);
      if (out.indexOf(n) < 0) out.push(n);
    }
  };
  tambah(b.sku);
  // "GP - 265NT" (spasi di sekitar tanda hubung) disatukan dulu menjadi "GP-265NT"
  const nama = String(b.nama || "").replace(/\s*[-\u2013]\s*/g, "-");
  nama.split(/[\s,;:()\[\]\/]+/).filter(Boolean).forEach(tambah);
  return out;
}

// true kalau jarak edit a dan b <= 1 (1 huruf salah / kurang / lebih)
function lev1_(a, b) {
  if (a === b) return true;
  const la = a.length, lb = b.length;
  if (Math.abs(la - lb) > 1) return false;
  let i = 0, j = 0, beda = 0;
  while (i < la && j < lb) {
    if (a[i] === b[j]) { i++; j++; continue; }
    if (++beda > 1) return false;
    if (la === lb) { i++; j++; }
    else if (la > lb) i++;
    else j++;
  }
  return beda + (la - i) + (lb - j) <= 1;
}

function cocokToken_(ocr, tok, fuzzy) {
  if (!fuzzy) return ocr.indexOf(tok) >= 0 ? tok.length : 0;
  if (tok.length < 6) return 0;
  for (let d = -1; d <= 1; d++) {
    const L = tok.length + d;
    for (let s = 0; s + L <= ocr.length; s++) {
      if (lev1_(ocr.substr(s, L), tok)) return tok.length - 0.5;
    }
  }
  return 0;
}

// Kode yang tampak di teks OCR: kata berisi angka (mis. GP-265NT, atau angka barcode). Dipakai untuk mencocokkan & ditampilkan.
function kodeDariTeks_(teks) {
  const out = [], seen = {};
  String(teks || "").split(/\s+/).forEach(w => {
    const k = w.replace(/^[^A-Za-z0-9]+|[^A-Za-z0-9]+$/g, "");
    const a = alnum_(k);
    if (a.length >= 5 && /[0-9]/.test(a) && (/[A-Z]/.test(a) || a.length >= 6)) {
      const n = normOcr_(k);
      if (!seen[n]) { seen[n] = 1; out.push({ tampil: k.toUpperCase(), n: n }); }
    }
  });
  return out;
}

// Return barang-barang yang paling cocok dengan teks hasil OCR (bisa lebih dari satu kalau skornya sama).
function cariDariTeks_(teks) {
  const ocr = normOcr_(teks);
  if (ocr.length < 5) return [];
  const kand = kodeDariTeks_(teks).map(x => x.n);
  const daftar = barang.map(b => ({ b: b, tok: tokenBarang_(b), gab: normOcr_(b.sku) + "|" + normOcr_(b.nama) }));
  const cari = fuzzy => {
    const hasil = [];
    daftar.forEach(x => {
      let best = 0;
      x.tok.forEach(t => { best = Math.max(best, cocokToken_(ocr, t, fuzzy)); });
      if (!fuzzy) kand.forEach(k => { if (x.gab.indexOf(k) >= 0) best = Math.max(best, k.length); });
      if (best > 0) hasil.push({ b: x.b, skor: best });
    });
    return hasil;
  };
  let hasil = cari(false);
  if (!hasil.length) hasil = cari(true);
  if (!hasil.length) return [];
  hasil.sort((a, z) => z.skor - a.skor);
  return hasil.filter(h => h.skor === hasil[0].skor);
}

async function bacaTulisan_(img, info) {
  await muatLibOcr();
  if (!ocrWorker) {
    try {
      ocrWorker = await Tesseract.createWorker("eng", 1, {
        logger: m => {
          if (!m || !m.status) return;
          if (/loading|initializ/i.test(m.status)) info("Menyiapkan pembaca tulisan… (pertama kali agak lama, perlu internet)");
          else if (/recogniz/i.test(m.status)) info("Membaca tulisan… " + Math.round((m.progress || 0) * 100) + "%");
        }
      });
      await ocrWorker.setParameters({ tessedit_char_whitelist: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-./ " });
    } catch (e) { ocrWorker = null; throw e; }
  }
  const percobaan = [
    { psm: "11", enh: false, balik: false },
    { psm: "6", enh: true, balik: false },
    { psm: "11", enh: true, balik: true }
  ];
  let semua = "";
  for (const p of percobaan) {
    const cv = p.enh ? keCanvasEnh_(img, 2200, p.balik) : keCanvas_(img, 2200);
    await ocrWorker.setParameters({ tessedit_pageseg_mode: p.psm });
    const r = await ocrWorker.recognize(cv);
    semua += " " + ((r && r.data && r.data.text) || "");
    const hasil = cariDariTeks_(semua);
    if (hasil.length) return { hasil: hasil, teks: semua };
  }
  return { hasil: [], teks: semua };
}

/* ---- alur satu foto ---- */
function temukanBarang_(kode) {
  const q = String(kode || "").trim().toLowerCase();
  if (!q) return null;
  return barang.find(x => String(x.sku).trim().toLowerCase() === q) ||
         barang.find(x => String(x.nama).trim().toLowerCase() === q) || null;
}

function scanInfo_(cls, teks) {
  const el = $("scanInfo");
  if (el) { el.className = "scaninfo " + cls; el.innerText = teks; }
}

function scanPilihKosong_() {
  const el = $("scanPilih");
  if (el) el.innerHTML = "";
}

// tutup = true (hasil foto): popup scan langsung menutup, barang sudah ada di keranjang kasir.
// tutup = false (kamera langsung / kode diketik): popup tetap terbuka supaya bisa scan beberapa barang.
function tambahDariScan_(b, tutup) {
  scanPilihKosong_();
  if (tambahKeranjang(b.id)) {
    bunyi();
    if (tutup) {
      tutupModal();
      toast("✅ " + b.nama + " • " + cart[b.id].qty + " di keranjang");
    } else {
      scanInfo_("pos", "✅ " + b.nama + " • " + cart[b.id].qty + " di keranjang");
    }
  } else {
    scanInfo_("neg", "⚠️ Stok " + b.nama + " tidak cukup");
  }
}

function tampilPilihan_(list) {
  scanInfo_("", "Ada beberapa barang yang cocok. Pilih salah satu:");
  const el = $("scanPilih");
  if (!el) return;
  el.innerHTML = list.slice(0, 6).map(b =>
    '<button class="btn ghost" style="width:100%;margin-top:8px;text-align:left" onclick="pilihScan(\'' + esc(b.id) + '\')">' +
    esc(b.nama) + (b.sku ? " • " + esc(b.sku) : "") + " (stok " + b.stok + ")</button>").join("");
}

function pilihScan(id) {
  const b = barang.find(x => x.id === id);
  if (b) tambahDariScan_(b, true);
}

async function scanFoto(inp) {
  const f = inp.files && inp.files[0];
  inp.value = "";
  if (!f) return;
  scanPilihKosong_();
  scanInfo_("", "Membaca foto…");

  let img;
  try { img = await bacaGambar_(f); }
  catch (e) { return scanInfo_("neg", "❌ " + ((e && e.message) || "Foto tidak bisa dibuka") + ". Coba foto ulang."); }

  // 1) barcode
  let kode = "";
  try { kode = await bacaDenganDetektor_(keCanvas_(img, 3000)); } catch (e) {}
  if (!kode) { try { await muatLibScan(); kode = await bacaDenganLib_(img); } catch (e) {} }
  if (kode) {
    const b = temukanBarang_(kode);
    if (b) return tambahDariScan_(b, true);
  }

  // 2) tulisan kode (mis. GP-265NT)
  let teks = "", galat = "";
  try {
    scanInfo_("", "Membaca tulisan…");
    const r = await bacaTulisan_(img, t => scanInfo_("", t));
    teks = r.teks;
    if (r.hasil.length === 1) return tambahDariScan_(r.hasil[0].b, true);
    if (r.hasil.length > 1) return tampilPilihan_(r.hasil.map(h => h.b));
  } catch (e) { galat = (e && e.message) || String(e); }

  const awal = kode ? "Barcode " + kode + " tidak ada di stok. " : "";
  if (galat) {
    return scanInfo_("neg", "⚠️ " + awal + "Pembaca tulisan tidak bisa jalan (" + galat + "). Ketik kodenya di bawah.");
  }
  const kand = kodeDariTeks_(teks).map(x => x.tampil).slice(0, 4);
  if (kand.length) {
    return scanInfo_("neg", "❌ " + awal + "Kode terbaca di foto: " + kand.join(", ") + ". Kode ini belum ada di Kode barang atau Nama barang di stok. " +
      "Isi Kode barang di barang yang sesuai (menu Stok → ketuk barang → Edit data barang), lalu foto lagi.");
  }
  const ringkas = teks.replace(/\s+/g, " ").trim().slice(0, 70);
  scanInfo_("neg", "❌ " + awal + "Tidak ada kode di foto yang cocok dengan stok. " +
    (ringkas ? "Terbaca: “" + ringkas + "”. " : "Tidak ada tulisan yang terbaca. ") +
    "Coba foto lebih dekat, terang, tulisan mendatar dan tidak buram.");
}

// Matikan kamera langsung (dipanggil dari bukaModal/tutupModal)
function stopScan() {
  clearInterval(ocrTimer);
  ocrTimer = null;
  if (!scanner) return;
  const s = scanner;
  scanner = null;
  try { s.stop().then(() => { try { s.clear(); } catch (x) {} }).catch(() => {}); } catch (e) {}
}

function bunyi() {
  try {
    if (navigator.vibrate) navigator.vibrate(60);
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.connect(g); g.connect(ac.destination);
    o.frequency.value = 880; g.gain.value = 0.08;
    o.start(); setTimeout(() => { o.stop(); ac.close(); }, 120);
  } catch (e) {}
}

// Kode yang diketik / dari scanner fisik: cocok persis dengan Kode barang atau Nama barang
function prosesKode(kode) {
  const q = String(kode || "").trim();
  if (!q) return;
  const b = temukanBarang_(q);
  if (!b) return scanInfo_("neg", "❌ Kode " + q + " tidak ditemukan");
  tambahDariScan_(b, false);
}

/* ================= BELANJA (POP UP) ================= */
let bkey = 0;
let brows = [];   // daftar belanja sementara
let fb = null;    // data form yang sedang dibuka

function barisBaru(tgl) {
  return { k: ++bkey, tgl: tgl || hariIni(), nama: "", id: "", kategori: "", satuan: "pcs", qty: "", total: "", harga: "", jual: "", kode: "" };
}

function cariBarang(v) {
  const q = String(v || "").trim().toLowerCase();
  if (!q) return null;
  return barang.find(b => String(b.nama).trim().toLowerCase() === q) ||
         barang.find(b => String(b.sku).trim().toLowerCase() === q) || null;
}

// Peta nama barang baru -> kode. Kode yang diketik manual dipakai apa adanya,
// yang dikosongkan dibuatkan otomatis (lanjut dari BRG terbesar).
function kodeMap(list) {
  let mx = 0;
  barang.forEach(b => {
    const m = /^BRG-(\d+)$/i.exec(String(b.sku).trim());
    if (m) mx = Math.max(mx, Number(m[1]));
  });
  const map = {};
  list.forEach(r => {
    if (r.id || !r.nama.trim()) return;
    const manual = String(r.kode || "").trim().toUpperCase();
    if (manual) map[r.nama.trim().toLowerCase()] = manual;
  });
  list.forEach(r => {
    if (r.id || !r.nama.trim()) return;
    const nm = r.nama.trim().toLowerCase();
    if (map[nm] === undefined) { mx++; map[nm] = "BRG-" + String(mx).padStart(4, "0"); }
  });
  return map;
}

function renderBelanja() {
  $("dlNama").innerHTML = barang.map(b => '<option value="' + esc(b.nama) + '">').join("");
  let total = 0;
  $("bList").innerHTML = brows.length ? brows.map(r => {
    const sub = (Number(r.qty) || 0) * (Number(r.harga) || 0);
    total += sub;
    return '<div class="item" onclick="bukaFormBelanja(' + r.k + ')">' +
      '<div class="tx"><div class="nm">' + esc(r.nama) + (r.id ? "" : ' <span class="badge">Baru</span>') + '</div>' +
      '<div class="sb">' + esc(r.tgl) + ' • ' + esc(r.qty) + ' ' + esc(r.satuan) + ' × ' + rp(r.harga) + '</div></div>' +
      '<div class="rt">' + rp(sub) + '</div>' +
      '<button class="xbtn" onclick="event.stopPropagation();hapusBaris(' + r.k + ')" aria-label="Hapus">✕</button></div>';
  }).join("") : '<div class="empty">Belum ada barang di daftar belanja.</div>';

  $("bTotalBox").innerHTML = '<div class="total" style="margin-top:0"><span>Total belanja</span><span>' + rp(total) + '</span></div>' +
    '<div style="font-size:12px;color:var(--muted);margin-top:4px">' + brows.length + ' barang</div>';
}

// Dari menu Stok: pindah ke tab Belanja dan buka form dengan nama barang terisi otomatis
function beliDariStok(id) {
  tutupModal();
  buka("belanja");
  bukaFormBelanja(0, id);
}

function bukaFormBelanja(k, idAwal) {
  const edit = k ? brows.find(x => x.k === k) : null;
  fb = edit ? Object.assign({ edit: true }, edit) : Object.assign({ edit: false }, barisBaru(brows.length ? brows[brows.length - 1].tgl : hariIni()));
  const b0 = (!edit && idAwal) ? barang.find(x => x.id === idAwal) : null;
  if (b0) {
    fb.id = b0.id;
    fb.nama = b0.nama;
    fb.kategori = b0.kategori;
    fb.satuan = b0.satuan;
    fb.jual = b0.jual;
  }
  renderFormBelanja();
  if (b0) setTimeout(() => { const el = $("fbQty"); if (el) el.focus(); }, 150);
}

function renderFormBelanja() {
  const edit = fb.edit;
  bukaModal(edit ? "Edit Belanja" : "Tambah Belanja",
    fld("fbTgl", "Tanggal", fb.tgl, "date", 'oninput="fbSet(\'tgl\',this.value)"') +
    '<label class="l">Nama barang</label><input id="fbNama" type="text" value="' + esc(fb.nama) + '" placeholder="Nama barang" autocomplete="off" ' +
      'oninput="fbNama(this.value)" onchange="dupCek()">' +
    '<div class="grid2">' +
      '<div><label class="l">Kode barang</label><input id="fbKode" type="text" value="' + esc(fb.kode || "") + '" autocomplete="off" autocapitalize="characters" oninput="fbSet(\'kode\',this.value)"><div class="hint" id="fbKodeHint"></div></div>' +
      '<div><label class="l">Kategori</label><input id="fbKat" type="text" list="dlKat" value="' + esc(fb.kategori) + '" placeholder="Kategori" oninput="fbSet(\'kategori\',this.value)"></div>' +
    '</div>' +
    '<div class="grid2">' +
      '<div><label class="l">Total Harga Belanja Produk</label><input id="fbQty" type="text" class="uang" inputmode="decimal" autocomplete="off" value="' + fmtAngka(fb.qty) + '" placeholder="0" oninput="fbSet(\'qty\',this.value)"></div>' +
      '<div><label class="l">Satuan</label><input id="fbSat" type="text" value="' + esc(fb.satuan) + '" oninput="fbSet(\'satuan\',this.value)"></div>' +
    '</div>' +
    '<div class="grid2">' +
      '<div><label class="l">Jumlah stok</label><input id="fbStok" type="text" readonly tabindex="-1"></div>' +
      '<div><label class="l">Harga pembelian</label><input id="fbTotal" type="text" class="uang" inputmode="numeric" autocomplete="off" value="' + fmtAngka(fb.total) + '" placeholder="Total bayar" oninput="fbSet(\'total\',this.value)"></div>' +
    '</div>' +
    '<div class="grid2">' +
      '<div><label class="l">Harga modal</label><input id="fbModal" type="text" readonly tabindex="-1" placeholder="Otomatis"><div class="hint" id="fbHint"></div></div>' +
      '<div><label class="l">Harga jual</label><input id="fbJual" type="text" class="uang" inputmode="numeric" autocomplete="off" value="' + fmtAngka(fb.jual) + '" placeholder="0" oninput="fbSet(\'jual\',this.value)"></div>' +
    '</div>' +
    '<div class="row"><button class="btn ghost" onclick="tutupModal()">Batal</button>' +
    '<button class="btn main" onclick="simpanForm()">✔ ' + (edit ? "Simpan" : "Tambahkan") + '</button></div>');
  fbHitung();
}

function fbSet(f, v) {
  fb[f] = (f === "total" || f === "jual" || f === "qty") ? rawAngka(v) : v;
  fbHitung();
}

function fbNama(v) {
  fb.nama = v;
  // Kalau form terhubung ke barang lama tapi nama diubah, lepaskan hubungannya
  const b0 = fb.id ? barang.find(x => x.id === fb.id) : null;
  if (b0 && String(b0.nama).trim().toLowerCase() !== v.trim().toLowerCase()) {
    fb.id = "";
    fb.kategori = ""; fb.satuan = "pcs"; fb.jual = "";
    fbIsi();
  }
  fbHitung();
}

// Nama yang diketik manual ternyata sudah ada -> popup Lihat / Batal. Return true kalau popup tampil.
function dupCek() {
  if (!fb || fb.id) return false;
  const b = cariBarang(fb.nama);
  if (!b) return false;
  bukaModal("Nama Barang sudah ada",
    '<p style="color:var(--muted);font-size:14px;line-height:1.5"><b>' + esc(b.nama) + '</b> sudah ada di daftar stok. ' +
    'Pilih <b>Lihat</b> untuk membuka di menu Stok, lalu klik barangnya &gt; Beli barang. Atau <b>Batal</b> untuk mengganti nama.</p>' +
    '<div class="row"><button class="btn ghost" onclick="dupBatal()">Batal</button>' +
    '<button class="btn main" onclick="lihatDiStok(\'' + esc(b.id) + '\')">Lihat</button></div>');
  return true;
}

function dupBatal() {
  fb.nama = "";
  fb.id = "";
  renderFormBelanja();
  setTimeout(() => { const el = $("fbNama"); if (el) el.focus(); }, 150);
}

function lihatDiStok(id) {
  const b = barang.find(x => x.id === id);
  if (!b) return;
  fb = null;
  tutupModal();
  stokFokus = id;
  filterStok = "semua";
  $("sf-semua").classList.add("active");
  $("sf-menipis").classList.remove("active");
  $("sCari").value = b.nama;
  buka("stok");
}

function fbIsi() {
  $("fbKat").value = fb.kategori;
  $("fbSat").value = fb.satuan;
  $("fbJual").value = fmtAngka(fb.jual);
}

function fbHitung() {
  const b = fb.id ? barang.find(x => x.id === fb.id) : null;
  const baru = !b && fb.nama.trim() !== "";
  const list = fb.edit ? brows.map(x => x.k === fb.k ? fb : x) : brows.concat([fb]);
  const map = kodeMap(list);

  // Kode barang: barang lama = dari stok (tidak bisa diubah di sini); barang baru = boleh diketik, kosong = otomatis
  const kEl = $("fbKode");
  if (b) {
    kEl.readOnly = true;
    kEl.value = b.sku || "-";
    kEl.placeholder = "";
    $("fbKodeHint").innerText = "Dari data stok";
  } else {
    kEl.readOnly = false;
    const auto = baru ? (map[fb.nama.trim().toLowerCase()] || "") : "";
    kEl.placeholder = auto ? "Otomatis: " + auto : "Otomatis";
    $("fbKodeHint").innerText = "Boleh diketik, mis. GP-265NT";
  }
  $("fbKat").readOnly = !!b;
  $("fbSat").readOnly = !!b;

  const qty = Number(fb.qty) || 0;
  const adaTotal = fb.total !== "" && fb.total != null;
  const stokLama = b ? b.stok : 0;

  $("fbStok").value = fb.nama.trim() ? (stokLama + (qty > 0 ? " → " + (stokLama + qty) : "")) : "";

  // Harga modal per satuan = harga pembelian / jumlah pembelian
  fb.harga = (qty > 0 && adaTotal) ? Number(fb.total) / qty : "";
  $("fbModal").value = fb.harga === "" ? "" : rp(fb.harga);

  const hint = $("fbHint");
  hint.className = "hint";
  hint.innerText = "";
  if (b && fb.harga !== "" && b.modal > 0) {
    const pct = Math.round((fb.harga - b.modal) / b.modal * 100);
    if (pct !== 0) {
      hint.className = "hint " + (pct > 0 ? "neg" : "pos");
      hint.innerText = (pct > 0 ? "▲ naik " : "▼ turun ") + Math.abs(pct) + "% dari " + rp(b.modal);
    }
  }
}

function simpanForm() {
  if (!fb.nama.trim()) return toast("⚠️ Nama barang belum diisi");
  if (dupCek()) return;
  if (!(Number(fb.qty) > 0)) return toast("⚠️ Total Harga Belanja Produk harus lebih dari 0");
  if (fb.total === "" || fb.total == null) return toast("⚠️ Harga pembelian belum diisi");
  if (!fb.id && fb.jual === "") return toast("⚠️ Harga jual barang baru belum diisi");
  if (!fb.id) {
    const kd = String(fb.kode || "").trim().toUpperCase();
    if (kd) {
      const pakai = barang.find(x => String(x.sku).trim().toUpperCase() === kd);
      if (pakai) return toast("⚠️ Kode " + kd + " sudah dipakai: " + pakai.nama);
      const lain = brows.find(x => !x.id && x.k !== fb.k && String(x.kode || "").trim().toUpperCase() === kd &&
        x.nama.trim().toLowerCase() !== fb.nama.trim().toLowerCase());
      if (lain) return toast("⚠️ Kode " + kd + " sudah dipakai " + lain.nama + " di daftar belanja");
      fb.kode = kd;
    }
  }
  const data = Object.assign({}, fb);
  delete data.edit;
  if (fb.edit) brows = brows.map(x => x.k === data.k ? data : x);
  else brows.push(data);
  tutupModal();
  renderBelanja();
}

function hapusBaris(k) {
  brows = brows.filter(x => x.k !== k);
  renderBelanja();
}

function resetBelanja() {
  brows = [];
  $("bSup").value = "";
  $("bCat").value = "";
  renderBelanja();
}

function simpanBelanja() {
  aksi(async () => {
    if (!brows.length) return toast("⚠️ Daftar belanja masih kosong");
    const map = kodeMap(brows);
    const items = brows.map(r => ({
      tanggal: r.tgl,
      idBarang: r.id,
      nama: r.nama.trim(),
      sku: r.id ? "" : (map[r.nama.trim().toLowerCase()] || ""),
      kategori: r.kategori,
      satuan: r.satuan,
      qty: r.qty,
      hargaBeli: r.harga,
      hargaJual: r.jual
    }));

    const hasil = await run("belanja", { items: items, supplier: $("bSup").value, catatan: $("bCat").value });
    brows = [];
    $("bCat").value = "";
    await muatBarang();
    renderBelanja();
    toast("✅ Belanja tersimpan • " + hasil.jumlah + " baris" + (hasil.baru ? " • " + hasil.baru + " barang baru" : "") + " • Total " + rp(hasil.total), 4000);
  });
}

/* ================= STOK ================= */
let filterStok = "semua";
let stokFokus = ""; // id barang yang disorot (dari popup "Lihat")
function setFilterStok(f) {
  filterStok = f;
  $("sf-semua").classList.toggle("active", f === "semua");
  $("sf-menipis").classList.toggle("active", f === "menipis");
  renderStok();
}
$("sCari").addEventListener("input", () => { stokFokus = ""; renderStok(); });

function renderStok() {
  const q = $("sCari").value.trim();
  const urut = (a, b) =>
    String(a.nama).trim().localeCompare(String(b.nama).trim(), "id", { numeric: true, sensitivity: "base" }) ||
    String(a.sku).trim().localeCompare(String(b.sku).trim(), "id", { numeric: true, sensitivity: "base" });
  const list = barang.filter(b => cocok(b, q) && (filterStok === "semua" || b.stok <= b.min)).sort(urut);
  $("sInfo").innerText = list.length + " barang";
  $("sList").innerHTML = list.length ? list.map(b =>
    '<div class="item' + (b.id === stokFokus ? " pilih" : "") + '" id="s-' + esc(b.id) + '" onclick="menuBarang(\'' + esc(b.id) + '\')">' +
    '<div class="tx"><div class="nm">' + esc(b.nama) + '</div>' +
    '<div class="sb">' + (b.sku ? "<b>" + esc(b.sku) + "</b> • " : "") + esc(b.kategori) + '<br>' +
    'Modal ' + rp(b.modal) + ' → Jual ' + rp(b.jual) + ' • <span class="' + (b.jual - b.modal >= 0 ? "pos" : "neg") + '">+' + rp(b.jual - b.modal).replace("Rp ", "") + '</span>' +
    (adaPack(b) ? '<br>📦 Pack (isi ' + b.isi + ') → ' + rp(b.jualPack) : '') +
    '</div></div>' +
    '<div class="rt"><span class="badge' + (b.stok <= b.min ? " low" : "") + '">' + b.stok + ' ' + esc(b.satuan) + '</span></div></div>').join("")
    : '<div class="card empty">Belum ada barang. Ketuk tombol ＋ untuk menambah.</div>';
  if (stokFokus) {
    const el = $("s-" + stokFokus);
    if (el) el.scrollIntoView({ block: "center" });
  }
}

function menuBarang(id) {
  const b = barang.find(x => x.id === id);
  if (!b) return;
  bukaModal(b.nama,
    '<div class="sb" style="color:var(--muted);font-size:13px">Stok ' + b.stok + ' ' + esc(b.satuan) + ' • Modal ' + rp(b.modal) + ' • Jual ' + rp(b.jual) +
    (adaPack(b) ? ' • Pack (isi ' + b.isi + ') ' + rp(b.jualPack) : '') + '</div>' +
    '<div class="menu">' +
    '<button onclick="beliDariStok(\'' + esc(id) + '\')">📥 Beli barang (stok masuk)</button>' +
    '<button onclick="formRetur(\'' + esc(id) + '\')">↩️ Retur barang (kembali ke supplier)</button>' +
    '<button onclick="formBarang(\'' + esc(id) + '\')">✏️ Edit data barang</button>' +
    '<button onclick="formKoreksi(\'' + esc(id) + '\')">🔧 Koreksi stok (opname)</button>' +
    '<button onclick="konfHapusBarang(\'' + esc(id) + '\')" style="color:var(--r)">🗑️ Hapus barang</button></div>');
}

function formBarang(id) {
  const b = id ? barang.find(x => x.id === id) : { nama: "", sku: "", kategori: "", satuan: "pcs", modal: "", jual: "", stok: "", min: 5, isi: "", jualPack: "" };
  bukaModal(id ? "Edit Barang" : "Barang Baru",
    fld("fNama", "Nama barang", b.nama, "text") +
    '<div class="grid2">' + fld("fSku", "Kode barang", b.sku, "text", 'placeholder="Otomatis" autocapitalize="characters"') + fld("fSatuan", "Satuan", b.satuan, "text") + '</div>' +
    fld("fKat", "Kategori", b.kategori, "text", 'list="dlKat"') +
    '<div class="grid2">' + fld("fModal", "Harga modal (per pcs)", b.modal, "uang") + fld("fJual", "Harga jual (per pcs)", b.jual, "uang") + '</div>' +
    '<div class="grid2">' + fld("fIsi", "Isi per pack (pcs)", b.isi || "", "uang", 'placeholder="mis. 12"') + fld("fJualPack", "Harga jual per pack", b.jualPack || "", "uang", 'placeholder="0"') + '</div>' +
    '<div class="hint">Isi kedua kolom pack kalau barang ini juga dijual per pack. Di Kasir nanti muncul pilihan Pcs / Pack. Stok tetap dihitung dalam pcs.</div>' +
    '<div class="grid2">' + (id ? "" : fld("fStok", "Stok awal (pcs)", b.stok, "uang")) + fld("fMin", "Stok minimum", b.min, "uang") + '</div>' +
    '<div class="row"><button class="btn ghost" onclick="tutupModal()">Batal</button>' +
    '<button class="btn main" onclick="simpanBarang(\'' + (id ? esc(id) : "") + '\')">Simpan</button></div>');
  // Barang baru: tampilkan kode berikutnya langsung di kolom (boleh diganti sendiri)
  if (!id) {
    run("getKodeBerikut").then(k => {
      const el = $("fSku");
      if (el && !el.value) el.value = k;
    }).catch(() => {});
  }
}

/* ===== DAFTAR KODE BARANG ===== */
function daftarKode() {
  const kosong = barang.filter(b => !String(b.sku || "").trim()).length;
  const urut = barang.slice().sort((a, b) => String(a.sku).localeCompare(String(b.sku)));
  const teks = urut.map(b => (b.sku || "-") + " | " + b.nama + " | " + rp(b.jual)).join("\n");
  bukaModal("Daftar Kode Barang",
    (kosong
      ? '<div style="color:var(--muted);font-size:13px;margin-bottom:8px">' + kosong + ' barang belum punya kode.</div>' +
        '<button class="btn main" style="width:100%;flex:none" onclick="buatKodeKosong()">⚡ Buat kode otomatis</button>'
      : '') +
    '<textarea id="kTeks" readonly style="min-height:220px;margin-top:10px">' + esc(teks) + '</textarea>' +
    '<div class="row"><button class="btn ghost" onclick="tutupModal()">Tutup</button>' +
    '<button class="btn main" onclick="salinDaftar()">📋 Salin daftar</button></div>');
}

function salinDaftar() {
  const t = $("kTeks");
  t.select();
  try { document.execCommand("copy"); toast("✅ Daftar kode disalin"); }
  catch (e) { toast("⚠️ Gagal menyalin, tahan lalu salin manual"); }
}

function buatKodeKosong() {
  aksi(async () => {
    const n = await run("isiKodeKosong");
    await muatBarang();
    renderStok();
    daftarKode();
    toast("✅ " + n + " kode barang dibuat");
  });
}

function simpanBarang(id) {
  aksi(async () => {
    const d = {
      id: id || "", nama: $("fNama").value, sku: $("fSku").value, satuan: $("fSatuan").value, kategori: $("fKat").value,
      modal: rawAngka($("fModal").value), jual: rawAngka($("fJual").value), min: rawAngka($("fMin").value),
      isi: rawAngka($("fIsi").value), jualPack: rawAngka($("fJualPack").value),
      stok: $("fStok") ? rawAngka($("fStok").value) : 0
    };
    if (!d.nama.trim()) return toast("⚠️ Nama barang wajib diisi");
    if ((Number(d.jualPack) || 0) > 0 && !((Number(d.isi) || 0) > 0)) return toast("⚠️ Isi per pack wajib diisi kalau harga pack diisi");
    await run("simpanBarang", d);
    tutupModal();
    await muatBarang();
    if (tabAktif === "belanja") renderBelanja(); else renderStok();
    toast("✅ Barang tersimpan");
  });
}

function formMasuk(id) {
  const b = barang.find(x => x.id === id);
  bukaModal("Beli Barang: " + b.nama,
    '<div style="color:var(--muted);font-size:13px">Stok sekarang ' + b.stok + ' ' + esc(b.satuan) + ' • Modal rata-rata ' + rp(b.modal) + '</div>' +
    '<div class="grid2">' + fld("mQty", "Jumlah masuk", "", "uang") + fld("mHm", "Harga modal / satuan", b.modal, "uang") + '</div>' +
    fld("mJual", "Harga jual (opsional, ubah)", b.jual, "uang") +
    fld("mSup", "Supplier (opsional)", "", "text") +
    fld("mTgl", "Tanggal", hariIni(), "date") +
    '<div class="row"><button class="btn ghost" onclick="tutupModal()">Batal</button>' +
    '<button class="btn main" onclick="simpanMasuk(\'' + esc(id) + '\')">Simpan</button></div>');
}

function simpanMasuk(id) {
  aksi(async () => {
    if (!(Number(rawAngka($("mQty").value)) > 0)) return toast("⚠️ Jumlah harus lebih dari 0");
    const r = await run("stokMasuk", {
      idBarang: id, qty: rawAngka($("mQty").value), hargaModal: rawAngka($("mHm").value), hargaJual: rawAngka($("mJual").value),
      supplier: $("mSup").value, tanggal: $("mTgl").value
    });
    tutupModal();
    await muatBarang();
    renderStok();
    toast("✅ Stok jadi " + r.stok + " • Modal rata-rata " + rp(r.modal), 3500);
  });
}

/* ===== RETUR BARANG ===== */
let fr = null; // { modal, manual }

function formRetur(id) {
  const b = barang.find(x => x.id === id);
  fr = { modal: b.modal, manual: false };
  bukaModal("Retur Barang: " + b.nama,
    '<div style="color:var(--muted);font-size:13px;line-height:1.5">Barang dikembalikan ke supplier. Stok akan berkurang. Stok sekarang ' +
      b.stok + ' ' + esc(b.satuan) + ' • Modal rata-rata ' + rp(b.modal) + '</div>' +
    fld("rQty", "Jumlah retur", "", "uang", 'oninput="returHitung()"') +
    fld("rNilai", "Nilai retur / uang kembali dari supplier (Rp)", "", "uang", 'oninput="fr.manual=true"') +
    '<div class="hint">Otomatis jumlah × modal rata-rata. Boleh diubah kalau supplier mengganti dengan nominal lain (isi 0 kalau tidak ada penggantian).</div>' +
    fld("rSup", "Supplier (opsional)", "", "text") +
    fld("rAlasan", "Alasan (opsional)", "", "text", 'placeholder="Rusak, kadaluarsa, salah kirim…"') +
    fld("rTgl", "Tanggal", hariIni(), "date") +
    '<div class="row"><button class="btn ghost" onclick="tutupModal()">Batal</button>' +
    '<button class="btn main" onclick="simpanRetur(\'' + esc(id) + '\')">Simpan Retur</button></div>');
}

function returHitung() {
  if (!fr || fr.manual) return;
  const q = Number(rawAngka($("rQty").value)) || 0;
  $("rNilai").value = q > 0 ? fmtAngka(Math.round(q * fr.modal * 100) / 100) : "";
}

function simpanRetur(id) {
  aksi(async () => {
    const b = barang.find(x => x.id === id);
    const q = Number(rawAngka($("rQty").value)) || 0;
    if (!(q > 0)) return toast("⚠️ Jumlah retur harus lebih dari 0");
    if (q > b.stok) return toast("⚠️ Stok " + b.nama + " hanya " + b.stok);
    const r = await run("returBarang", {
      idBarang: id, qty: q, nilai: rawAngka($("rNilai").value),
      supplier: $("rSup").value, alasan: $("rAlasan").value, tanggal: $("rTgl").value
    });
    tutupModal();
    await muatBarang();
    renderStok();
    toast("✅ Retur tersimpan • Stok jadi " + r.stok + " • Nilai " + rp(r.nilai), 3500);
  });
}

function formKoreksi(id) {
  const b = barang.find(x => x.id === id);
  bukaModal("Koreksi Stok: " + b.nama,
    '<div style="color:var(--muted);font-size:13px">Dipakai kalau stok di sistem beda dengan stok fisik (rusak, hilang, salah hitung).</div>' +
    fld("kStok", "Stok sebenarnya", b.stok, "uang") +
    '<div class="row"><button class="btn ghost" onclick="tutupModal()">Batal</button>' +
    '<button class="btn main" onclick="simpanKoreksi(\'' + esc(id) + '\')">Simpan</button></div>');
}

function simpanKoreksi(id) {
  aksi(async () => {
    await run("koreksiStok", id, rawAngka($("kStok").value));
    tutupModal();
    await muatBarang();
    renderStok();
    toast("✅ Stok dikoreksi");
  });
}

function konfHapusBarang(id) {
  const b = barang.find(x => x.id === id);
  tanya("Hapus barang?", "<b>" + esc(b.nama) + "</b> akan dihapus dari daftar. Riwayat penjualan lama tetap tersimpan.", "Hapus", () => {
    aksi(async () => {
      await run("hapusBarang", id);
      delete cart[id];
      await muatBarang();
      renderStok();
      toast("🗑️ Barang dihapus");
    });
  });
}

/* ================= LAPORAN ================= */
let modeLap = "jual";
$("lDari").value = awalBulan();
$("lSampai").value = hariIni();

function setModeLap(m) {
  modeLap = m;
  $("lm-jual").classList.toggle("active", m === "jual");
  $("lm-masuk").classList.toggle("active", m === "masuk");
  $("lm-retur").classList.toggle("active", m === "retur");
  muatLaporan();
}

async function muatLaporan() {
  const dari = $("lDari").value, sampai = $("lSampai").value;
  if (!dari || !sampai) return toast("⚠️ Pilih tanggal dulu");
  $("lBox").innerHTML = '<div class="skel"></div><div class="skel"></div>';
  try {
    if (modeLap === "jual") renderLapJual(await run("getRiwayatPenjualan", dari, sampai));
    else if (modeLap === "masuk") renderLapMasuk(await run("getStokMasuk", dari, sampai));
    else renderLapRetur(await run("getRetur", dari, sampai));
  } catch (e) {
    $("lBox").innerHTML = '<div class="card empty">' + esc(pesanErr(e)) + '</div>';
  }
}

function renderLapJual(list) {
  if (!list.length) { $("lBox").innerHTML = '<div class="card empty">Tidak ada penjualan di rentang ini.</div>'; return; }
  const g = {}, urut = [];
  let omzet = 0, untung = 0, diskon = 0;
  list.forEach(r => {
    if (!g[r.trx]) { g[r.trx] = { trx: r.trx, tgl: r.tgl, items: [], total: 0, untung: 0, diskon: 0, catatan: r.catatan, tipe: r.tipe, kasir: r.kasir }; urut.push(r.trx); }
    g[r.trx].items.push(r);
    g[r.trx].total += r.totalJual;
    g[r.trx].untung += r.untung;
    g[r.trx].diskon += r.diskon;
    omzet += r.totalJual;
    untung += r.untung;
    diskon += r.diskon;
  });
  let h = '<div class="stats" style="margin-bottom:12px">' + kartu("Omzet", rp(omzet), "🛍️", "c-b") + kartu("Untung Kotor", rp(untung), "📈", untung >= 0 ? "c-g" : "c-r") +
    (diskon > 0 ? kartu("Total Diskon", rp(diskon), "🎫", "c-p", true) : "") + '</div>';
  urut.forEach(k => {
    const t = g[k];
    const bd = t.tipe === "kjp" ? ' <span class="badge kjp">KJP</span>' : "";
    h += '<div class="trx"><div class="hd"><span>' + esc(t.tgl) + bd + '</span><span>' + esc(t.trx) + '</span></div>';
    t.items.forEach(i => {
      h += '<div class="ln"><span>' + esc(i.nama) + ' × ' + i.qty + '</span><span>' + rp(i.totalJual) + '</span></div>';
    });
    if (t.diskon > 0) h += '<div class="sb" style="font-size:12px;color:var(--muted)">🎫 Diskon ' + esc(NAMA_TIPE[t.tipe] || t.tipe) + ' −' + rp(t.diskon) + '</div>';
    if (t.catatan) h += '<div class="sb" style="font-size:12px;color:var(--muted)">📝 ' + esc(t.catatan) + '</div>';
    h += '<div class="ft"><span>' + rp(t.total) + ' <span class="' + (t.untung >= 0 ? "pos" : "neg") + '" style="font-size:12px">(untung ' + rp(t.untung) + ')</span></span>' +
      '<button class="btn red sm" onclick="konfBatal(\'' + esc(t.trx) + '\')">Batalkan</button></div></div>';
  });
  $("lBox").innerHTML = h;
}

function konfBatal(trx) {
  tanya("Batalkan transaksi?", "Stok barang akan dikembalikan dan transaksi <b>" + esc(trx) + "</b> dihapus dari laporan.", "Batalkan", () => {
    aksi(async () => {
      await run("batalTransaksi", trx);
      await muatBarang();
      toast("✅ Transaksi dibatalkan, stok dikembalikan");
      muatLaporan();
    });
  });
}

function renderLapMasuk(list) {
  if (!list.length) { $("lBox").innerHTML = '<div class="card empty">Tidak ada stok masuk di rentang ini.</div>'; return; }
  const total = list.reduce((s, r) => s + r.total, 0);
  let h = '<div class="stats" style="margin-bottom:12px">' + kartu("Total Pembelian", rp(total), "📥", "c-o", true) + '</div>';
  list.forEach(r => {
    h += '<div class="trx"><div class="hd"><span>' + esc(r.tgl) + '</span><span>' + esc(r.supplier || "-") + '</span></div>' +
      '<div class="ln"><span>' + esc(r.nama) + ' × ' + r.qty + '</span><span>' + rp(r.total) + '</span></div>' +
      '<div class="sb" style="font-size:12px;color:var(--muted)">@ ' + rp(r.hm) + (r.catatan ? " • " + esc(r.catatan) : "") + '</div></div>';
  });
  $("lBox").innerHTML = h;
}

function renderLapRetur(list) {
  if (!list.length) { $("lBox").innerHTML = '<div class="card empty">Tidak ada retur di rentang ini.</div>'; return; }
  const total = list.reduce((s, r) => s + r.total, 0);
  let h = '<div class="stats" style="margin-bottom:12px">' + kartu("Total Nilai Retur", rp(total), "↩️", "c-o", true) + '</div>';
  list.forEach(r => {
    h += '<div class="trx"><div class="hd"><span>' + esc(r.tgl) + '</span><span>' + esc(r.supplier || "-") + '</span></div>' +
      '<div class="ln"><span>' + esc(r.nama) + ' × ' + r.qty + '</span><span>' + rp(r.total) + '</span></div>' +
      '<div class="sb" style="font-size:12px;color:var(--muted)">Modal @ ' + rp(r.hm) + (r.alasan ? " • " + esc(r.alasan) : "") + '</div></div>';
  });
  $("lBox").innerHTML = h;
}

/* ================= BIAYA ================= */
$("eTgl").value = hariIni();

async function muatBiaya() {
  $("eBox").innerHTML = '<div class="skel"></div>';
  try {
    const r = await run("getPengeluaran", awalBulan(), hariIni());
    $("eJudul").innerText = "Pengeluaran bulan ini • " + rp(r.total);
    $("eBox").innerHTML = r.list.length ? r.list.map(x =>
      '<div class="item" style="cursor:default"><div class="tx"><div class="nm">' + esc(x.kategori) + '</div><div class="sb">' + esc(x.tgl) + (x.ket ? " • " + esc(x.ket) : "") + '</div></div>' +
      '<div class="rt neg">' + rp(x.jumlah) + '</div>' +
      '<button class="btn ghost sm" onclick="konfHapusBiaya(\'' + esc(x.id) + '\')">🗑️</button></div>').join("")
      : '<div class="card empty">Belum ada pengeluaran bulan ini.</div>';
  } catch (e) {
    $("eBox").innerHTML = '<div class="card empty">' + esc(pesanErr(e)) + '</div>';
  }
}

function simpanBiaya() {
  aksi(async () => {
    if (!(Number(rawAngka($("eJml").value)) > 0)) return toast("⚠️ Jumlah harus lebih dari 0");
    await run("simpanPengeluaran", { tanggal: $("eTgl").value, kategori: $("eKat").value, keterangan: $("eKet").value, jumlah: rawAngka($("eJml").value) });
    $("eKet").value = ""; $("eJml").value = "";
    toast("✅ Pengeluaran tersimpan");
    muatBiaya();
  });
}

function konfHapusBiaya(id) {
  tanya("Hapus pengeluaran?", "Data ini akan dihapus dari perhitungan laba bersih.", "Hapus", () => {
    aksi(async () => { await run("hapusPengeluaran", id); toast("🗑️ Dihapus"); muatBiaya(); });
  });
}

/* ================= MULAI ================= */
(async function init() {
  try { const k = await run("getKonfig"); if (k) KONF = k; } catch (e) {}
  renderTipe();
  tabAktif = "beranda";
  await muatSemua();
})();
</script>
