<!DOCTYPE html>
<html lang="id">
<head>
<base target="_top">
<meta charset="UTF-8">
<title>Toko Istana Buku</title>
<style>
:root{
  --bg:#f3f6f4;--surface:#fff;--text:#14201a;--muted:#667a70;--line:#e2e9e5;--input:#f8faf9;
  --primary:#0f766e;--soft:#ccfbf1;--shadow:0 6px 22px rgba(15,118,110,.10);--tabh:64px;
  --g:#16a34a;--gb:#dcfce7;--b:#2563eb;--bb:#dbeafe;--o:#ea580c;--ob:#ffedd5;--r:#dc2626;--rb:#fee2e2;--p:#7c3aed;--pb:#ede9fe;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0c1512;--surface:#15211c;--text:#eaf4ef;--muted:#93a89d;--line:#25352e;--input:#101b17;
    --primary:#2dd4bf;--soft:#123b36;--shadow:0 6px 22px rgba(0,0,0,.4);
    --gb:#12351f;--bb:#14264d;--ob:#41230f;--rb:#451515;--pb:#2a2150}
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{background:var(--bg);color:var(--text);font-size:16px}
.app{max-width:600px;margin:0 auto;min-height:100vh}
.hero{background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff;padding:20px 18px 54px;border-radius:0 0 28px 28px;display:flex;justify-content:space-between;align-items:center}
.hero h1{font-size:21px;font-weight:800}
.hero .sub{font-size:12px;opacity:.85}
.hero .acts{display:flex;gap:8px}
.pgnama{display:inline-block;margin-top:7px;padding:4px 12px;border-radius:99px;background:rgba(255,255,255,.25);font-size:13px;font-weight:800}
.ib{border:none;background:rgba(255,255,255,.2);color:#fff;width:40px;height:40px;border-radius:12px;font-size:19px;cursor:pointer}
main{padding:0 14px calc(var(--tabh) + 40px);margin-top:-32px}
.page{display:none}.page.active{display:block}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow);margin-bottom:14px}
h3.sec{font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin:18px 4px 8px}
.empty{color:var(--muted);font-size:14px;padding:8px 2px}

/* chips & form */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--text);font-size:13px;font-weight:700;cursor:pointer}
.chip.active{background:var(--primary);border-color:var(--primary);color:#fff}
@media (prefers-color-scheme:dark){.chip.active{color:#06201c}}
label.l{display:block;margin:12px 2px 5px;font-size:13px;font-weight:700}
input,select,textarea{width:100%;padding:12px 13px;font-size:16px;border-radius:13px;border:2px solid var(--line);background:var(--input);color:var(--text);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--primary)}
input[readonly]{opacity:.75}
textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;padding:14px 10px;font-size:15px;font-weight:800;border:none;border-radius:14px;cursor:pointer}
.btn:disabled{opacity:.55}
.btn.main{flex:2;background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff}
.btn.ghost{background:var(--surface);color:var(--text);border:2px solid var(--line)}
.btn.red{background:var(--r);color:#fff}
.btn.sm{padding:8px 12px;font-size:13px;flex:none;border-radius:11px}

/* stat */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px;box-shadow:var(--shadow)}
.stat.wide{grid-column:1/-1}
.stat.klik{cursor:pointer;position:relative}
.stat.klik:active{transform:scale(.98)}
.stat.klik::after{content:"›";position:absolute;right:12px;top:10px;font-size:20px;font-weight:800;color:var(--muted);opacity:.7}
.stat .top{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-weight:700}
.stat .ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:15px;background:var(--sb)}
.stat .num{font-size:21px;font-weight:800;margin-top:7px;color:var(--sc)}
.stat.wide .num{font-size:28px}
.c-g{--sc:var(--g);--sb:var(--gb)}.c-b{--sc:var(--b);--sb:var(--bb)}.c-o{--sc:var(--o);--sb:var(--ob)}
.c-r{--sc:var(--r);--sb:var(--rb)}.c-p{--sc:var(--p);--sb:var(--pb)}

/* detail kartu */
.dtlhead{margin-top:6px;padding:12px;border-radius:14px;background:var(--input);border:1px solid var(--line)}
.dtlhead .rm{font-size:13px;color:var(--muted);line-height:1.5}
.dtlhead .tt{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-weight:800}
.dtlhead .tt .big{font-size:22px}
.dtl{display:flex;justify-content:space-between;gap:10px;padding:10px 2px;border-bottom:1px dashed var(--line)}
.dtl:last-child{border-bottom:none}
.dtl .tx{flex:1;min-width:0}
.dtl .nm{font-weight:700;font-size:14px;word-break:break-word}
.dtl .sb{font-size:12px;color:var(--muted);margin-top:2px;word-break:break-word}
.dtl .v{font-weight:800;font-size:14px;white-space:nowrap}

/* list item */
.item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);margin-bottom:8px;cursor:pointer}
.item .tx{flex:1;min-width:0}
.item .nm{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .sb{font-size:12px;color:var(--muted);margin-top:2px}
.item .rt{text-align:right;font-size:13px;font-weight:700;white-space:nowrap}
.badge{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:800;background:var(--gb);color:var(--g)}
.badge.low{background:var(--rb);color:var(--r)}
.badge.kjp{background:var(--bb);color:var(--b)}
.badge.off{background:var(--line);color:var(--muted)}
.item.off{opacity:.45;pointer-events:none}
.item.pilih{border-color:var(--primary);background:var(--soft);box-shadow:0 0 0 2px var(--primary)}
.pos{color:var(--g)}.neg{color:var(--r)}

/* chart */
.chart{display:flex;align-items:flex-end;gap:5px;height:130px;padding-top:8px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.chart .bar{width:100%;border-radius:6px 6px 0 0;background:linear-gradient(to top,#0f766e,#14b8a6);min-height:3px}
.chart .lb{font-size:9px;color:var(--muted);margin-top:4px}

/* cart */
.cartrow{padding:10px 0;border-bottom:1px dashed var(--line)}
.cartrow:last-child{border-bottom:none}
.cartrow .h{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:14px}
.cartrow .ctl{display:flex;align-items:center;gap:8px;margin-top:8px}
.qbtn{width:34px;height:34px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--text);font-size:18px;font-weight:800;cursor:pointer;flex:none}
.qv{min-width:32px;text-align:center;font-weight:800}
.cartrow input{padding:8px 10px;font-size:14px;border-radius:10px;flex:1;min-width:0}
.cartrow select{padding:8px 6px;font-size:14px;font-weight:700;border-radius:10px;width:auto;flex:none}
.total{display:flex;justify-content:space-between;font-size:18px;font-weight:800;margin-top:12px}

/* pembayaran kasir */
.bayar{margin-top:12px;padding:12px;border-radius:14px;background:var(--input);border:1px solid var(--line)}
.bayar .ln2{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:3px 0}
.bayar .big{font-size:20px;font-weight:800}
.bayar .inrow{display:flex;gap:8px;align-items:center}
.bayar .inrow input{flex:1;font-size:18px;font-weight:800}
.kembali{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding:12px;border-radius:12px;background:var(--gb);font-weight:800}
.kembali .v{font-size:22px}
.kembali.kurang{background:var(--rb)}

/* trx group */
.trx{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
.trx .hd{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px;gap:8px}
.trx .ln{display:flex;justify-content:space-between;font-size:14px;padding:3px 0}
.trx .ft{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-weight:800;font-size:14px}

.seg{display:flex;background:var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:none;background:transparent;padding:9px 4px;border-radius:10px;font-weight:800;font-size:14px;color:var(--muted);cursor:pointer}
.seg button.active{background:var(--surface);color:var(--primary)}

/* belanja */
.hint{font-size:11px;color:var(--muted);margin-top:3px;min-height:13px}
.hint.neg{color:var(--r)}
.hint.pos{color:var(--g)}
.xbtn{border:none;background:var(--rb);color:var(--r);width:32px;height:34px;border-radius:9px;font-weight:800;cursor:pointer;flex:none}

/* tab */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:600px;height:var(--tabh);display:flex;background:var(--surface);border-top:1px solid var(--line);z-index:40}
.tab{flex:1;border:none;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:700;cursor:pointer}
.tab .ti{font-size:21px}
.tab{position:relative}
.tab.active{color:var(--primary);background:var(--soft)}
.tab.active::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 4px 4px;background:var(--primary)}

/* fab */
.fab{position:fixed;right:18px;bottom:calc(var(--tabh) + 16px);width:54px;height:54px;border-radius:50%;border:none;background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff;font-size:28px;box-shadow:0 10px 22px -6px #0f766e;z-index:35;display:none;cursor:pointer}
.fab.show{display:block}

/* modal */
.modal{position:fixed;inset:0;background:rgba(10,16,13,.7);display:none;align-items:flex-end;justify-content:center;z-index:100}
.modal.show{display:flex}
.sheet{background:var(--surface);width:100%;max-width:600px;border-radius:24px 24px 0 0;padding:20px 18px 26px;max-height:92vh;overflow-y:auto}
.sheet h4{font-size:18px;margin-bottom:6px}
.menu button{display:block;width:100%;text-align:left;padding:14px 12px;margin-top:8px;border-radius:13px;border:2px solid var(--line);background:var(--input);color:var(--text);font-size:15px;font-weight:700;cursor:pointer}

.toast{position:fixed;left:50%;transform:translate(-50%,20px);bottom:calc(var(--tabh) + 20px);width:calc(100% - 32px);max-width:540px;text-align:center;background:rgba(15,20,18,.95);color:#fff;padding:13px 16px;border-radius:14px;font-size:14px;line-height:1.4;z-index:300;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.skel{height:70px;border-radius:16px;margin-bottom:10px;background:linear-gradient(90deg,var(--line) 25%,var(--input) 50%,var(--line) 75%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}

/* scan */
#scanBox{width:100%;border-radius:14px;overflow:hidden;background:#000;min-height:200px;margin-top:12px}
.scaninfo{margin-top:10px;font-size:14px;font-weight:700;text-align:center;min-height:20px}
.fotolbl{display:block;text-align:center;margin-top:10px;padding:12px 10px}
</style>
</head>
<body>

<div class="app" id="app">

<header class="hero">
  <div><div class="sub"><span id="tgl"></span></div><h1>🏪 Toko Istana Buku</h1><div class="pgnama" id="pgNama">📊 Beranda</div></div>
  <div class="acts">
    <button class="ib" onclick="muatSemua()" aria-label="Muat ulang">⟳</button>
  </div>
</header>

<main>

  <!-- BERANDA -->
  <section id="p-beranda" class="page active">
    <div class="chips" id="perChips"></div>
    <div id="berandaBox"><div class="skel"></div><div class="skel"></div></div>
  </section>

  <!-- KASIR -->
  <section id="p-kasir" class="page">
    <div class="card">
      <div class="seg" id="tipeSeg" style="margin-bottom:12px">
        <button data-k="umum" class="active" onclick="setTipe('umum')">Umum</button>
        <button data-k="kjp" onclick="setTipe('kjp')">KJP</button>
      </div>
      <div style="display:flex;gap:8px">
        <input type="text" id="kCari" placeholder="🔍 Ketik nama / kode barang…" autocomplete="off" style="flex:1;min-width:0">
        <button class="btn main sm" style="flex:none" onclick="bukaScan()">📷 Scan</button>
      </div>
      <div id="kList" style="margin-top:12px;display:none"></div>
    </div>
    <h3 class="sec">Keranjang</h3>
    <div class="card" id="kCart"></div>
  </section>

  <!-- BELANJA -->
  <section id="p-belanja" class="page">
    <div class="card">
      <div style="font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:12px">
        Ketuk tombol di bawah untuk menambah barang belanjaan. Kalau barang sudah ada, data terisi otomatis.
        Kalau belum ada, barang baru dibuat dengan kode otomatis.
      </div>
      <div id="bList"></div>
      <button class="btn main" style="width:100%;margin-top:6px;flex:none" onclick="bukaFormBelanja()">＋ Tambah barang</button>
    </div>
    <div class="card" id="bTotalBox"></div>
    <div class="card">
      <label class="l" style="margin-top:0">Supplier / Toko (opsional)</label>
      <input type="text" id="bSup" placeholder="Nama supplier">
      <label class="l">Catatan (opsional)</label>
      <input type="text" id="bCat" placeholder="Catatan belanja">
      <div class="row">
        <button class="btn ghost" onclick="resetBelanja()">Kosongkan</button>
        <button class="btn main" onclick="simpanBelanja()">✔ Simpan Belanja</button>
      </div>
    </div>
    <datalist id="dlNama"></datalist>
  </section>

  <!-- STOK -->
  <section id="p-stok" class="page">
    <div class="card">
      <input type="text" id="sCari" placeholder="🔍 Cari nama / SKU / kategori…" autocomplete="off">
      <div class="seg" style="margin:12px 0 0">
        <button id="sf-semua" class="active" onclick="setFilterStok('semua')">Semua</button>
        <button id="sf-menipis" onclick="setFilterStok('menipis')">Menipis</button>
      </div>
      <button class="btn ghost" style="width:100%;margin-top:10px" onclick="daftarKode()">🏷️ Daftar kode barang</button>
    </div>
    <div id="sInfo" class="empty"></div>
    <div id="sList"></div>
  </section>

  <!-- LAPORAN -->
  <section id="p-laporan" class="page">
    <div class="card">
      <div class="seg">
        <button id="lm-jual" class="active" onclick="setModeLap('jual')">Penjualan</button>
        <button id="lm-masuk" onclick="setModeLap('masuk')">Stok Masuk</button>
        <button id="lm-retur" onclick="setModeLap('retur')">Retur</button>
      </div>
      <div class="grid2">
        <div><label class="l" style="margin-top:0">Dari</label><input type="date" id="lDari"></div>
        <div><label class="l" style="margin-top:0">Sampai</label><input type="date" id="lSampai"></div>
      </div>
      <button class="btn main" style="width:100%;margin-top:12px" onclick="muatLaporan()">Tampilkan</button>
    </div>
    <div id="lBox"></div>
  </section>

  <!-- BIAYA -->
  <section id="p-biaya" class="page">
    <div class="card">
      <div class="grid2">
        <div><label class="l" style="margin-top:0">Tanggal</label><input type="date" id="eTgl"></div>
        <div><label class="l" style="margin-top:0">Kategori</label>
          <input type="text" id="eKat" list="dlBiaya" placeholder="Listrik, gaji…">
          <datalist id="dlBiaya"><option>Listrik</option><option>Gaji</option><option>Sewa</option><option>Transport</option><option>Internet</option><option>Lainnya</option></datalist>
        </div>
      </div>
      <label class="l">Keterangan</label>
      <input type="text" id="eKet" placeholder="Opsional">
      <label class="l">Jumlah (Rp)</label>
      <input type="text" id="eJml" class="uang" inputmode="numeric" placeholder="0" autocomplete="off">
      <button class="btn main" style="width:100%;margin-top:14px" onclick="simpanBiaya()">Simpan Pengeluaran</button>
    </div>
    <h3 class="sec" id="eJudul">Pengeluaran bulan ini</h3>
    <div id="eBox"></div>
  </section>

</main>

<button class="fab" id="fab" onclick="formBarang()" aria-label="Tambah barang">＋</button>

<nav class="tabbar">
  <button class="tab active" data-t="beranda" onclick="buka('beranda')"><span class="ti">📊</span>Beranda</button>
  <button class="tab" data-t="kasir" onclick="buka('kasir')"><span class="ti">🛒</span>Kasir</button>
  <button class="tab" data-t="belanja" onclick="buka('belanja')"><span class="ti">📥</span>Belanja</button>
  <button class="tab" data-t="stok" onclick="buka('stok')"><span class="ti">📦</span>Stok</button>
  <button class="tab" data-t="laporan" onclick="buka('laporan')"><span class="ti">🧾</span>Laporan</button>
  <button class="tab" data-t="biaya" onclick="buka('biaya')"><span class="ti">💸</span>Biaya</button>
</nav>

<div class="modal" id="modal" onclick="if(event.target===this)tutupModal()">
  <div class="sheet"><h4 id="mJudul"></h4><div id="mIsi"></div></div>
</div>

<div class="toast" id="toast"></div>
<datalist id="dlKat"></datalist>
</div>

<script>
/* ================= HELPER ================= */
const $ = id => document.getElementById(id);
const rp = n => (Number(n) < 0 ? "-" : "") + "Rp " + Math.abs(Math.round(Number(n) || 0)).toLocaleString("en-US");
const dua = n => String(n).padStart(2, "0");
const esc = s => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const fmtPct = p => String(p).replace(".", ",") + "%";
// Pemisah ribuan otomatis untuk kolom uang (class "uang"): 10000 -> 10,000
const fmtAngka = v => {
  if (typeof v === "number") v = Math.round(v * 100) / 100;
  const s = String(v == null ? "" : v).replace(/[^\d.]/g, "");
  if (!s) return "";
  const p = s.split(".");
  const dec = p.length > 1 ? p.slice(1).join("") : null;
  const ib = p[0] ? Number(p[0]).toLocaleString("en-US") : (dec !== null ? "0" : "");
  return dec !== null ? ib + "." + dec : ib;
};
const rawAngka = v => String(v == null ? "" : v).replace(/,/g, "");
document.addEventListener("input", e => {
  const el = e.target;
  if (!el.classList || !el.classList.contains("uang")) return;
  const pos = el.selectionStart == null ? el.value.length : el.selectionStart;
  const kiri = el.value.slice(0, pos).replace(/[^\d.]/g, "").length;
  el.value = fmtAngka(el.value);
  let n = 0, i = 0;
  for (; i < el.value.length && n < kiri; i++) if (/[\d.]/.test(el.value[i])) n++;
  try { el.setSelectionRange(i, i); } catch (x) {}
}, true);
const adaGoogle = () => typeof google !== "undefined" && google.script && google.script.run;

/* ================= PANGGILAN SERVER (tanpa login) ================= */
const sesi = { token: "", user: { id: "app", username: "kasir", nama: "Kasir", role: "owner" } };
const isOwner = () => true;

function raw(fn) {
  const args = Array.prototype.slice.call(arguments, 1);
  return new Promise((ok, gagal) => {
    if (!adaGoogle()) return gagal(new Error("Buka lewat link web app (.../exec), bukan preview"));
    google.script.run.withSuccessHandler(ok).withFailureHandler(gagal)[fn].apply(google.script.run, args);
  });
}

// Kalau halaman ini di-hosting DI LUAR Apps Script (mis. GitHub Pages) supaya kamera langsung bisa dipakai,
// isi dengan URL web app Apps Script (yang berakhiran /exec). Kalau dipakai di dalam Apps Script, biarkan kosong.
const API_URL = "https://script.google.com/macros/s/AKfycbyoqEbG0wQUyXp2vv5wnO_Khu610c5mQ0uu7-8gFYeiDENTTIqGOoy30q1YNcUbtMUBlg/exec";

async function fetchApi_(fn, args) {
  if (!API_URL) throw new Error("API_URL belum diisi di index.html");
  const res = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" }, // text/plain supaya tidak kena preflight CORS
    body: JSON.stringify({ fn: fn, args: args })
  });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || "Server error");
  return j.data;
}

function run(fn) {
  const args = Array.prototype.slice.call(arguments, 1);
  return adaGoogle() ? raw("api", fn, args) : fetchApi_(fn, args);
}

function ymd(d) { return d.getFullYear() + "-" + dua(d.getMonth() + 1) + "-" + dua(d.getDate()); }
function hariIni() { return ymd(new Date()); }
function geser(n) { const d = new Date(); d.setDate(d.getDate() + n); return ymd(d); }
function awalBulan() { const d = new Date(); return ymd(new Date(d.getFullYear(), d.getMonth(), 1)); }

let toastTimer = null;
function toast(msg, ms) {
  const el = $("toast");
  el.innerText = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), ms || (String(msg).indexOf("❌") === 0 ? 6000 : 2400));
}
function pesanErr(e) { return "❌ " + (e && e.message ? e.message.replace(/^Error:\s*/, "") : "Terjadi kesalahan"); }

let busy = false;
async function aksi(fn) {
  if (busy) return;
  busy = true;
  try { await fn(); } catch (e) { toast(pesanErr(e)); } finally { busy = false; }
}

/* ================= MODAL ================= */
function bukaModal(judul, html) {
  stopScan();
  $("mJudul").innerText = judul;
  $("mIsi").innerHTML = html;
  $("modal").classList.add("show");
}
function tutupModal() { stopScan(); $("modal").classList.remove("show"); }

let cbYa = null;
function tanya(judul, pesan, labelYa, cb) {
  cbYa = cb;
  bukaModal(judul,
    '<p style="color:var(--muted);font-size:14px;line-height:1.5">' + pesan + '</p>' +
    '<div class="row"><button class="btn ghost" onclick="tutupModal()">Batal</button>' +
    '<button class="btn red" onclick="tutupModal();cbYa&&cbYa()">' + esc(labelYa) + '</button></div>');
}

function fld(id, label, val, type, extra) {
  const u = type === "uang";
  return '<label class="l">' + label + '</label><input id="' + id + '" type="' + (u ? "text" : (type || "text")) + '" value="' + esc(u ? fmtAngka(val) : val) + '" ' +
    (u ? 'class="uang" inputmode="numeric" autocomplete="off" ' : (type === "number" ? 'inputmode="decimal" ' : "")) + (extra || "") + '>';
}

let tabAktif = "beranda";
function buka(t) {
  if (!NAMA_MENU[t]) t = "beranda";
  tabAktif = t;
  $("pgNama").innerText = NAMA_MENU[t] || t;
  document.querySelectorAll(".page").forEach(p => p.classList.toggle("active", p.id === "p-" + t));
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("active", b.dataset.t === t));

  window.scrollTo(0, 0);
  if (t === "beranda") muatBeranda();
  if (t === "kasir") renderKasir();
  if (t === "belanja") renderBelanja();

}

// Barang bisa dijual per pack kalau isi pack & harga pack sudah diisi
function adaPack(b) { return !!b && b.isi > 0 && b.jualPack > 0; }

/* ================= BERANDA ================= */
const PERIODE = [
  { k: "hari", l: "Hari ini", dari: () => hariIni() },
  { k: "7", l: "7 hari", dari: () => geser(-6) },
  { k: "bulan", l: "Bulan ini", dari: () => awalBulan() },
  { k: "semua", l: "Semua", dari: () => "2000-01-01" }
];
let periode = "bulan";

function chipPeriode() {
  $("perChips").innerHTML = PERIODE.map(p =>
    '<button class="chip' + (p.k === periode ? " active" : "") + '" onclick="setPeriode(\'' + p.k + '\')">' + p.l + '</button>').join("");
}
function setPeriode(k) { periode = k; muatBeranda(); }

// jenis (opsional): kalau diisi, kartu bisa diklik dan menampilkan rincian sumber datanya
function kartu(label, nilai, ikon, cls, wide, jenis) {
  return '<div class="stat ' + cls + (wide ? " wide" : "") + (jenis ? " klik" : "") + '"' +
    (jenis ? ' onclick="detailKartu(\'' + jenis + '\')"' : "") +
    '><div class="top"><span class="ic">' + ikon + '</span>' + label +
    '</div><div class="num">' + nilai + '</div></div>';
}

async function muatBeranda() {
  chipPeriode();
  $("berandaBox").innerHTML = '<div class="skel"></div><div class="skel"></div>';
  try {
    const p = PERIODE.find(x => x.k === periode);
    const d = await run("getDashboard", p.dari(), hariIni());
    let h = '<div class="stats">';
    h += kartu("Laba Bersih", rp(d.labaBersih), "💰", d.labaBersih >= 0 ? "c-g" : "c-r", true, "laba");
    h += kartu("Omzet (Penjualan)", rp(d.omzet), "🛍️", "c-b", false, "omzet");
    h += kartu("Modal Terjual", rp(d.hpp), "🏷️", "c-o", false, "hpp");
    h += kartu("Untung Kotor", rp(d.untungKotor), "📈", d.untungKotor >= 0 ? "c-g" : "c-r", false, "untungKotor");
    h += kartu("Biaya Operasional", rp(d.biaya), "💸", "c-r", false, "biaya");
    h += kartu("Transaksi", d.jumlahTrx + " (" + d.qtyTerjual + " item)", "🧾", "c-p", false, "trx");
    h += kartu("Diskon KJP", rp(d.diskon || 0), "🎫", "c-p", false, "diskon");
    h += kartu("Total Belanja", rp(d.totalPembelian), "📥", "c-b", false, "belanja");
    h += kartu("Retur ke Supplier", rp(d.totalRetur || 0), "↩️", "c-o", true, "retur");
    h += '</div>';

    h += '<h3 class="sec">Aset di Stok Sekarang</h3><div class="stats">';
    h += kartu("Total Harga dasar", rp(d.nilaiModalStok), "🏦", "c-o", false, "modalStok");
    h += kartu("Potensi Nilai Jual", rp(d.nilaiJualStok), "🏪", "c-g", false, "jualStok");
    h += kartu("Potensi Untung Stok", rp(d.nilaiJualStok - d.nilaiModalStok), "✨", "c-p", true, "potensiStok");
    h += '</div>';

    h += '<h3 class="sec">Penjualan Harian</h3><div class="card">';

      h += '<div class="chart">' + d.harian.map(x =>

        '<div class="lb">' + x.tgl.slice(8) + '/' + x.tgl.slice(5, 7) + '</div></div>').join("") + '</div>';
    } else h += '<div class="empty">Belum ada penjualan di periode ini.</div>';

    h += '<h3 class="sec">⚠️ Stok Menipis / Habis</h3><div class="card">';
    h += d.stokMenipis.length ? d.stokMenipis.map(b =>
      '<div class="ln" style="display:flex;justify-content:space-between;padding:5px 0"><span>' + esc(b.nama) + '</span><span class="badge low">' +
      b.stok + ' ' + esc(b.satuan) + '</span></div>').join("") : '<div class="empty">Semua stok aman 👍</div>';
    h += '</div>';

    h += d.terlaris.length ? d.terlaris.map((b, i) =>
      '<div style="display:flex;justify-content:space-between;padding:5px 0"><span>' + (i + 1) + '. ' + esc(b.nama) + '</span><span><b>' +
      b.qty + '</b> terjual · <span class="pos">' + rp(b.untung) + '</span></span></div>').join("") : '<div class="empty">Belum ada data.</div>';
    h += '</div>';
